name: macOS builds
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Apollo/**'
      - 'ApolloUpdate/**'
      - 'Native/**'
      - 'Publish/**'
      - 'Tests/**'
      - 'Shared/**'
      - 'global.json'
      - '.github/workflows/macos-build.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: osx-x64
            arch: x86_64
          - runner: macos-15
            rid: osx-arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish, bundle, ad-hoc sign and create DMG
        run: |
          sh Publish/publish.sh ${{ matrix.rid }}
      - name: Verify native architecture and MIDI loopback
        run: |
          xcrun lipo Build/${{ matrix.rid }}/Apollo/Apollo -verify_arch ${{ matrix.arch }}
          xcrun lipo Build/${{ matrix.rid }}/Update/ApolloUpdate -verify_arch ${{ matrix.arch }}
          for library in Build/${{ matrix.rid }}/Apollo/*.dylib Build/${{ matrix.rid }}/Update/*.dylib; do
            xcrun lipo "$library" -verify_arch ${{ matrix.arch }}
          done
          python3 Tests/native_rtmidi_smoke.py "Build/${{ matrix.rid }}-app/Apollo Studio.app/Contents/MacOS/librtmidi.dylib"
      - name: Verify release selection and installer projects
        run: |
          APOLLO_TEST_RELEASE_ASSETS=1 dotnet run --project Tests/Apollo.Scenarios.csproj -c Release -- artifacts/release-tests
          python3 Tests/test_mac_package.py
          python3 Tests/test_mac_bundle.py
          dotnet run --project Tests/Packaging/Packaging.csproj -c Release
      - name: Verify editor input and graceful Quit
        run: |
          python3 Tests/run-scenarios.py --output artifacts/headless
          python3 Tests/run-scenarios.py --suite quit --output artifacts/quit-headless
      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-${{ matrix.rid }}
          path: Dist/*
          if-no-files-found: error
